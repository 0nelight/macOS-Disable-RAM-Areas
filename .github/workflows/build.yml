name: Build EFI

# Builds disable-ram-area.efi from source with gnu-efi so the binary is always
# generated from the current code (and can never lag behind it). Runs on every
# push/PR and on manual dispatch. Pushing a version tag (v*) additionally
# creates a GitHub Release and attaches the freshly built, smoke-tested .efi to
# it — so a release binary is always built by CI from the tagged source.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write   # needed to attach the built .efi to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gnu-efi toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnu-efi build-essential binutils

      - name: Build
        run: make

      - name: Verify output
        run: |
          test -f disable-ram-area.efi
          file disable-ram-area.efi
          sha256sum disable-ram-area.efi

      - name: Install QEMU + OVMF (smoke test)
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools dosfstools

      - name: Boot smoke test (fails if the binary faults at runtime)
        run: |
          chmod +x scripts/uefi-smoke-test.sh
          scripts/uefi-smoke-test.sh disable-ram-area.efi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: disable-ram-area-efi
          path: disable-ram-area.efi
          if-no-files-found: error

      # On a version tag push, create (or update) the GitHub Release for that
      # tag and attach the built binary. Runs only after the smoke test passes,
      # so a faulting binary can never reach a release.
      - name: Create release and attach binary
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: disable-ram-area.efi
